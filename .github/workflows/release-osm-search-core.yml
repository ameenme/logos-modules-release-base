name: Release osm-search-core

# Manually-triggered release for the osm_search_core module (Rust cdylib
# search core). Delegates to the shared _release-module.yml reusable
# workflow (4 platforms: darwin-arm64, linux-amd64, linux-arm64,
# windows-x86_64). The windows-x86_64 leg is a mingw cross-build (Rust cdylib
# + bundled SQLite) that is slow on a cold nix cache; the md5-asm code blocker
# was fixed in core 7b7184c, so this is a build-time concern only.
#
# Source of truth for module name + version is
# submodules/osm-search-core/metadata.json.
#
# Generated by scripts/add-module.sh. (Temporarily restored to the 4-platform
# delegation to validate the Windows/mingw leg after the md5-asm fix.)
#
# Source of truth for module name + version is
# submodules/osm-search-core/metadata.json.
#
# Generated by scripts/add-module.sh. (Temporarily restored to the 4-platform
# delegation to validate the Windows/mingw leg after the md5-asm fix.)

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build — replace the current published release if it has the same version."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release-module.yml
    with:
      module_path: submodules/osm-search-core
      force_build: ${{ inputs.force_build }}
    secrets: inherit
