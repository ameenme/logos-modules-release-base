name: Release osm-search-core

# Manually-triggered release for the osm_search_core module (Rust cdylib
# search core). Delegates to the shared _release-module.yml reusable workflow
# (4 platforms incl. windows-x86_64 mingw cross-build).
#
# NOTE on Windows build time: the mingw leg builds cross-Qt + glib + harfbuzz
# + the Rust crate from source (~60-90 min on a 2-core GitHub runner) because
# those derivations are not in the logos ATTIC cache. It is NOT a hang and the
# md5-asm code blocker is fixed (core 7b7184c). Let it run to completion.
#
# Generated by scripts/add-module.sh.

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build — replace the current published release if it has the same version."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release-module.yml
    with:
      module_path: submodules/osm-search-core
      force_build: ${{ inputs.force_build }}
    secrets: inherit
