name: Release osm-search-core

# Manually-triggered release for the osm_search_core module (Rust cdylib
# search core). Calls the upstream release action DIRECTLY with 3 variants
# (darwin + linux): the windows-x86_64 mingw cross-build of a Rust cdylib
# with bundled SQLite is prohibitively slow on a cold nix cache (osm_renderer
# skipped windows for the same documented reason). The md5-asm code blocker
# is fixed (core 7b7184c), so this is a build-time issue, not a code issue.
# Mac + Linux cover the stated target; Windows can be re-enabled by reverting
# to 'uses: ./.github/workflows/_release-module.yml' once the mingw cold-cache
# build is diagnosed or pre-warmed.
#
# Source of truth for module name + version is
# submodules/osm-search-core/metadata.json.
#
# Generated by scripts/add-module.sh then hand-edited to drop the windows variant.

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build — replace the current published release if it has the same version."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: logos-co/logos-modules-release-action/.github/workflows/release.yml@v1
    with:
      module_path: submodules/osm-search-core
      skip_if_published: ${{ !inputs.force_build }}
      variants: "darwin-arm64,linux-amd64,linux-arm64"
      signing_mode: none
    secrets: inherit
