name: Release osm-search-app

# Manually-triggered release for the osm_search Basecamp app (ui_qml).
# Calls the upstream release action DIRECTLY with 3 variants (darwin + linux)
# rather than delegating to _release-module.yml: the app depends on
# osm_search_core, whose windows-x86_64 mingw cross-build (Rust cdylib +
# bundled SQLite) is prohibitively slow on a cold nix cache (osm_renderer
# skipped windows for the same reason). Mac + Linux cover the stated target.
#
# Source of truth for module name + version is
# submodules/osm-search-app/metadata.json.
#
# This file was generated by scripts/add-module.sh then hand-edited to drop
# the windows variant. To restore 4-platform builds, switch back to:
#   uses: ./.github/workflows/_release-module.yml
#   with: { module_path: submodules/osm-search-app, force_build: ... }

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build — replace the current published release if it has the same version."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: logos-co/logos-modules-release-action/.github/workflows/release.yml@v1
    with:
      module_path: submodules/osm-search-app
      skip_if_published: ${{ !inputs.force_build }}
      variants: "darwin-arm64,linux-amd64,linux-arm64"
      signing_mode: none
    secrets: inherit
