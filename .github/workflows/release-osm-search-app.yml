name: Release osm-search-app

# Manually-triggered release for the osm_search Basecamp app (ui_qml).
# Delegates to the shared _release-module.yml reusable workflow (4 platforms).
# The app depends on osm_search_core, which now ships all 4 platforms (the
# Windows/mingw cross-Qt build completes in ~75min). The md5-asm code blocker
# is fixed in the core.
#
# Source of truth for module name + version is
# submodules/osm-search-app/metadata.json.
#
# Generated by scripts/add-module.sh.

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build — replace the current published release if it has the same version."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release-module.yml
    with:
      module_path: submodules/osm-search-app
      force_build: ${{ inputs.force_build }}
    secrets: inherit
