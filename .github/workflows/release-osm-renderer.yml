name: Release osm-renderer

# Manually-triggered release for the OSM map renderer module.
# Calls the upstream release action directly with 3 variants (windows
# cross-compile is slow and not needed for testing; can be added later).

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build — replace the current published release if it has the same version."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: logos-co/logos-modules-release-action/.github/workflows/release.yml@v1
    with:
      module_path: submodules/logos-osm/examples/osm-renderer
      skip_if_published: ${{ !inputs.force_build }}
      variants: "darwin-arm64,linux-amd64,linux-arm64"
    secrets: inherit
