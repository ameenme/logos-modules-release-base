name: Release osm-consumer

# Manually-triggered release for the consumer-app, which lives INSIDE the
# logos-osm submodule at examples/consumer-app/. Mirrors release-logos-osm-app.yml:
# the upstream release action cds into module_path and builds .#lgx-portable
# from the flake at examples/consumer-app/flake.nix. Source of truth for module
# name + version is examples/consumer-app/metadata.json (name=osm_consumer).

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build — replace the current published release if it has the same version."
        type: boolean
        default: false

# Forked repos default to a read-only GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release-module.yml
    with:
      module_path: submodules/logos-osm/examples/consumer-app
      force_build: ${{ inputs.force_build }}
    secrets: inherit
